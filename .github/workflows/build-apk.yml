name: Compilar APK de Comunity TV

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 🔥 PASO CLAVE: Instalar SDK de Android y herramientas
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      # 🔥 PASO CLAVE: Configurar Gradle SIN usar 'gradlew'
      - name: Configurar Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.5'

      # Compilamos directamente con el comando 'gradle'
      - name: Compilar APK Debug
        run: gradle assembleDebug --no-daemon

      - name: Subir APK a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Comunity-TV-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
