name: Compilar APK de Comunity TV

# Cuándo se ejecutará:
on:
  # Cada vez que subas cambios a la rama principal
  push:
    branches: [ "main", "master" ]
  # También puedes ejecutarlo manualmente desde la pestaña "Actions"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # Usamos un servidor Linux limpio

    steps:
      # 1. Descargar el código de tu repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Java 17 (necesario para Android Gradle)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Dar permisos de ejecución al script de Gradle
      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      # 4. Compilar la versión Debug (sin necesidad de firmar)
      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      # 5. Subir el APK generado como "Artifact" para descargarlo
      - name: Subir APK a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Comunity-TV-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
